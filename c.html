   <body>
    

    <div class="weakMark">
        You got below C6 in some subjects, while you might meet the requirements for certain university, getting D7,E8 and F9 will lower your chances of entering the university.
    </div>





    <script>

            const weakMark = [
                {
                    subject:"english",
                    grade:"D7"
                },{
                    subject:"social",
                    grade:"E8"
                },{
                    subject:"math",
                    grade:"F9"
                }
            ]

            let gradeHtml = ''
            weakMark.map(e=>{
                gradeHtml+=`
                   ${e.grade},
                `
            })

            let subjectHtml = '';
            weakMark.map(sub=>{
                subjectHtml+=`
                    ${sub.subject},
                `
            })

            const link =`
            <div class="weakmark" style="font-style:italic">
               Getting ${gradeHtml} in ${subjectHtml} respectively may reduce your chances of admission.
               Even though you may see eligible programs, universities often prioritize stronger grades.
               <a href="https://www.google.com">Talk to an assistant</a>
            </div>    
            ` 


            document.querySelector('.weakMark').innerHTML = link ;

    </script>
   </body>
