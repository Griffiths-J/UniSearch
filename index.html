<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniLift | Maintenance</title>
    <style>
        :root {
            --bg: #f2f4f7;
            --accent: ##3cc6d6; 
            --glass: rgba(42, 42, 42, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --text-main: #000;
            --text-dim: #1a1919;
            
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 700px;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-weight: 700;
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            display: block;
        }

        h1 {
            font-size: clamp(2rem, 10vw, 4rem); 
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            color: var(--text-dim);
            max-width: 500px;
            margin: 0 auto 3rem auto;
            line-height: 1.6;
        }

      
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 3rem;
        }

        .time-box {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: clamp(1rem, 3vw, 2rem) 0;
            border-radius: 18px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .time-box span { display: block; }
        
        .number {
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1px;
        }

     
        .enquiry-btn {
            display: inline-block;
            background: var(--glass);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .enquiry-btn:hover {
            background: var(--text-main);
            color: var(--bg);
            transform: scale(1.05);
        }

       
        @media (max-width: 400px) {
            .countdown-grid { gap: 8px; }
            .time-box { border-radius: 12px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <span class="logo">
           <div class="logo">
        <img width="40px" loading="lazy" src="images/u-logo.png" alt="logo" />
        <p>UniLift</p>
      </div>
        </span>
        <h1>We're upgrading.</h1>
        <p>Enhancing our eligibility engine for a better admission experience. We'll be back in:</p>

        <div class="countdown-grid" id="timer">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hrs</span>
            </div>
            <div class="time-box">
                <span class="number" id="mins">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="secs">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <a href="https://wa.me/+233509304981?text=Hi Unilift, I need some enquires." target="_blank" class="enquiry-btn">Tap here for enquiries</a>
    </div>

    <script>
        
        const target = new Date("2026-05-11T12:00:00Z").getTime();

        function runTimer() {
            const now = new Date().getTime();
            const diff = target - now;

            if (diff <= 0) {
                document.querySelector(".wrapper").innerHTML = "<h1>We are Live.</h1><p>Refresh to access the portal.</p>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("mins").innerText = m.toString().padStart(2, '0');
            document.getElementById("secs").innerText = s.toString().padStart(2, '0');
        }

        setInterval(runTimer, 1000);
        runTimer();
    </script>
</body>
</html>
