<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UniLift PDF Demo</title>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #f1f5f9;
        color: #0f1724;
        padding: 32px 16px;
        margin: 0;
      }
      .card {
        max-width: 800px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        padding: 32px;
        border: 1px solid #e2e8f0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: 1px solid #f1f5f9;
      }
      .brand img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      .controls {
        margin-top: 24px;
      }
      button {
        background: linear-gradient(135deg, #177de4 0%, #00bfff 100%);
        border: none;
        color: #fff;
        padding: 14px 24px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 10px 15px -3px rgba(23, 125, 228, 0.3);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 20px -3px rgba(23, 125, 228, 0.4);
      }
      pre {
        background: #f8fafc;
        padding: 16px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        overflow: auto;
        font-size: 0.85rem;
      }
      .muted {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img
          id="logo-img"
          src="images/u-logo.png"
          alt="UniLift logo"
          crossorigin="anonymous"
        />
        <div>
          <div style="font-weight: 800; font-size: 1.2rem; color: #177de4; letter-spacing: -0.02em;">
            UNILIFT.APP
          </div>
          <div style="font-size: 0.875rem; color: #64748b">
            Premium PDF Match Report Generator
          </div>
        </div>
      </div>

      <p style="margin-top: 20px; color: #334155; line-height: 1.5;">
        Generate an official, high-grade PDF match summary for students directly client-side.
      </p>

      <div class="controls">
        <button id="genPdf">Download Premium PDF Report</button>
      </div>

      <h4 style="margin-top: 28px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b;">
        Sample Payload Data
      </h4>
      <pre id="sampleData"></pre>

      <label
        for="customNote"
        style="display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem;"
      >
        Custom Disclaimer / Notice (Appears near report bottom)
      </label>
      <textarea
        id="customNote"
        rows="2"
        style="
          width: 100%;
          margin-top: 8px;
          padding: 12px;
          border-radius: 8px;
          border: 1px solid #cbd5e1;
          font-family: inherit;
          box-sizing: border-box;
        "
      >
This eligibility report is strictly for guidance. Always cross-check entry thresholds on official university portals before submitting applications.</textarea
      >
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      const BRAND = {
        primary: "#177de4",
        accent: "#00bfff",
        dark: "#0f1724",
        text: "#1e293b",
        muted: "#64748b",
        lightBg: "#f8fafc",
        border: "#e2e8f0",
        tipBg: "#f0f9ff",
        tipBorder: "#0284c7"
      };

      const sample = {
        name: "John Doe",
        email: "john.doe@example.com",
        university: "University of Ghana",
        aggregate: 12,
        weakGrades: ["Mathematics", "Physics", "Chemistry"],
        courses: [
          { program_name: "BSc Computer Science", cutoff: 12 },
          { program_name: "BSc Economics", cutoff: 10 },
          { program_name: "BSc Information Technology", cutoff: 13 },
          { program_name: "BA Communication Studies", cutoff: 14 },
          { program_name: "BSc Mathematics", cutoff: 11 },
        ],
      };

      document.getElementById("sampleData").innerText = JSON.stringify(sample, null, 2);

      async function imageToDataUrl(imgEl) {
        return new Promise((resolve) => {
          if (!imgEl || !imgEl.src) return resolve(null);
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            try {
              resolve(canvas.toDataURL("image/png"));
            } catch (err) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = imgEl.src;
        });
      }

      function hexToRgb(hex) {
        const cleaned = hex.replace("#", "");
        const r = parseInt(cleaned.substring(0, 2), 16);
        const g = parseInt(cleaned.substring(2, 4), 16);
        const b = parseInt(cleaned.substring(4, 6), 16);
        return [r, g, b];
      }

      function selectTips(student, { elegible = [], weakGrades = [] } = {}, N = 2) {
        const pool = [
          "Small improvements in one core subject often significantly expand program eligibility.",
          "Strengthening elective subjects can bolster chances for competitive entry cutoffs.",
          "Explore foundational/bridge courses if your aggregate score is right at the cutoff boundary.",
          "If you meet requirements for multiple tracks, prioritize alignment over sheer selectivity."
        ];
        const results = [];

        if ((weakGrades || []).length > 2) {
          results.push("Consider institutions offering flexible foundation pathways or bursary opportunities.");
        }
        if ((elegible || []).length === 0) {
          results.push("Explore diploma or pre-degree programs to bridge entry cutoff margins.");
        }
        if ((elegible || []).length >= 8 && results.length < N) {
          results.push("Shortlist your top 3 preferred choices and apply early in the admissions window.");
        }

        const near = (student.courses || []).some(c => Math.abs(student.aggregate - c.cutoff) <= 2);
        if (near && results.length < N) {
          results.push("Consider targeted revision or retakes for subjects nearest to cutoff thresholds.");
        }

        const seed = hashString(student.name || "") || Date.now();
        const rnd = mulberry32(seed);
        const shuffled = pool.slice().sort(() => rnd() - 0.5);
        for (let i = 0; i < shuffled.length && results.length < N; i++) {
          if (!results.includes(shuffled[i])) results.push(shuffled[i]);
        }
        return results.slice(0, N);
      }

      function hashString(str) {
        if (!str) return 0;
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h;
      }

      function mulberry32(a) {
        return function () {
          var t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      document.getElementById("genPdf").addEventListener("click", async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        const pageWidth = 210;
        const pageHeight = 297;
        const leftMargin = 16;
        const rightMargin = 16;
        const contentWidth = pageWidth - leftMargin - rightMargin;
        const bottomThreshold = pageHeight - 28;

        let logoData = null;
        try {
          const logoEl = document.getElementById("logo-img");
          logoData = await imageToDataUrl(logoEl);
        } catch (e) {}

        // Full Header Bar Rendering
        function drawHeader(yPos) {
          // Decorative top accent bar
          doc.setFillColor(...hexToRgb(BRAND.primary));
          doc.rect(0, 0, pageWidth, 4, "F");

          if (logoData) {
            doc.addImage(logoData, "PNG", leftMargin, yPos, 12, 12);
            
            // Site Name (Prominent & Vivid)
            doc.setFont("helvetica", "bold");
            doc.setFontSize(15);
            doc.setTextColor(...hexToRgb(BRAND.primary));
            doc.text("UNILIFT.APP", leftMargin + 16, yPos + 6);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(...hexToRgb(BRAND.muted));
            doc.text("Official University Eligibility Report", leftMargin + 16, yPos + 11);
          } else {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(15);
            doc.setTextColor(...hexToRgb(BRAND.primary));
            doc.text("UNILIFT.APP", leftMargin, yPos + 6);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.5);
            doc.setTextColor(...hexToRgb(BRAND.muted));
            doc.text("Official University Eligibility Report", leftMargin, yPos + 11);
          }

          // Thin header separator line
          doc.setDrawColor(...hexToRgb(BRAND.border));
          doc.setLineWidth(0.3);
          doc.line(leftMargin, yPos + 15, pageWidth - rightMargin, yPos + 15);
        }

        let currentY = 12;
        drawHeader(currentY);
        currentY += 22;

        // Executive Profile Box
        const cardH = 28;
        doc.setFillColor(...hexToRgb(BRAND.lightBg));
        doc.setDrawColor(...hexToRgb(BRAND.border));
        doc.setLineWidth(0.3);
        doc.roundedRect(leftMargin, currentY, contentWidth, cardH, 3, 3, "FD");

        // Profile Column 1 (Student Info)
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("STUDENT NAME", leftMargin + 6, currentY + 7);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor(...hexToRgb(BRAND.dark));
        doc.text(sample.name || "—", leftMargin + 6, currentY + 12);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("EMAIL ADDRESS", leftMargin + 6, currentY + 19);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.text));
        doc.text(sample.email || "—", leftMargin + 6, currentY + 24);

        // Profile Column 2 (University & Score)
        const col2X = leftMargin + 92;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("TARGET INSTITUTION", col2X, currentY + 7);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.setTextColor(...hexToRgb(BRAND.dark));
        doc.text(sample.university || "—", col2X, currentY + 12);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("AGGREGATE SCORE", col2X, currentY + 19);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.setTextColor(...hexToRgb(BRAND.primary));
        doc.text(String(sample.aggregate), col2X + 32, currentY + 24);

        currentY += cardH + 10;

        // Section Heading
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(...hexToRgb(BRAND.dark));
        doc.text("Eligible Academic Programs", leftMargin, currentY);
        currentY += 5;

        // Table Rendering
        const thH = 8;
        const colCutoffW = 35;
        const colProgW = contentWidth - colCutoffW;

        function drawTableHeader(y) {
          doc.setFillColor(...hexToRgb(BRAND.primary));
          doc.rect(leftMargin, y, contentWidth, thH, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.setTextColor(255, 255, 255);
          doc.text("PROGRAM NAME", leftMargin + 5, y + 5.5);
          doc.text("CUTOFF GRADE", leftMargin + contentWidth - 6, y + 5.5, { align: "right" });
        }

        drawTableHeader(currentY);
        currentY += thH;

        const rowHeightMin = 8.5;
        for (let i = 0; i < sample.courses.length; i++) {
          const c = sample.courses[i];
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);

          const programLines = doc.splitTextToSize(c.program_name, colProgW - 8);
          const rowH = Math.max(rowHeightMin, programLines.length * 5 + 3);

          if (currentY + rowH > bottomThreshold) {
            doc.addPage();
            currentY = 12;
            drawHeader(currentY);
            currentY += 22;
            drawTableHeader(currentY);
            currentY += thH;
          }

          // Alternate row shading
          if (i % 2 === 0) {
            doc.setFillColor(...hexToRgb(BRAND.lightBg));
            doc.rect(leftMargin, currentY, contentWidth, rowH, "F");
          }

          doc.setTextColor(...hexToRgb(BRAND.text));
          doc.text(programLines, leftMargin + 5, currentY + 5.5);

          const cutoff = String(c.cutoff ?? c.cutoff_criteria?.minimum_aggregate ?? "—");
          doc.setFont("helvetica", "bold");
          doc.setTextColor(...hexToRgb(BRAND.dark));
          doc.text(cutoff, leftMargin + contentWidth - 6, currentY + 5.5, { align: "right" });

          currentY += rowH;
        }

        currentY += 8;

        // "Tips" Section
        const tips = selectTips(
          sample,
          {
            elegible: sample.courses.filter((c) => sample.aggregate <= c.cutoff),
            weakGrades: sample.weakGrades,
          },
          2
        );

        const tipsBoxH = 12 + tips.length * 6;
        if (currentY + tipsBoxH > bottomThreshold) {
          doc.addPage();
          currentY = 12;
          drawHeader(currentY);
          currentY += 22;
        }

        // Clean subtle light background with a vertical accent bar
        doc.setFillColor(...hexToRgb(BRAND.tipBg));
        doc.rect(leftMargin, currentY, contentWidth, tipsBoxH, "F");
        
        doc.setFillColor(...hexToRgb(BRAND.tipBorder));
        doc.rect(leftMargin, currentY, 2, tipsBoxH, "F");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(...hexToRgb(BRAND.tipBorder));
        doc.text("Tips", leftMargin + 6, currentY + 6);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(...hexToRgb(BRAND.text));

        for (let t = 0; t < tips.length; t++) {
          doc.text(`• ${tips[t]}`, leftMargin + 8, currentY + 12 + t * 6);
        }

        currentY += tipsBoxH + 8;

        // Custom Note (Disclaimer)
        const customNoteVal = document.getElementById("customNote").value.trim();
        if (customNoteVal) {
          doc.setFont("helvetica", "italic");
          doc.setFontSize(8);
          doc.setTextColor(...hexToRgb(BRAND.muted));

          const noteLines = doc.splitTextToSize(customNoteVal, contentWidth);
          const noteH = noteLines.length * 4;

          if (currentY + noteH > bottomThreshold) {
            doc.addPage();
            currentY = 12;
            drawHeader(currentY);
            currentY += 22;
          }

          doc.text(noteLines, leftMargin, currentY + 3);
          currentY += noteH + 6;
        }

        // Inquiries & Support Box
        const inquiryBoxH = 14;
        if (currentY + inquiryBoxH > bottomThreshold) {
          doc.addPage();
          currentY = 12;
          drawHeader(currentY);
          currentY += 22;
        }

        doc.setFillColor(...hexToRgb(BRAND.lightBg));
        doc.setDrawColor(...hexToRgb(BRAND.border));
        doc.setLineWidth(0.3);
        doc.roundedRect(leftMargin, currentY, contentWidth, inquiryBoxH, 2, 2, "FD");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(...hexToRgb(BRAND.dark));
        doc.text("Need Help or Have Inquiries?", leftMargin + 5, currentY + 5.5);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text(
          "Contact support via email: uniliftapp1@gmail.com  |  WhatsApp: +233 50 930 4981  |  Visit: unilift.app",
          leftMargin + 5,
          currentY + 10.5
        );

        // Multi-Page Footer Pass
        const totalPages = doc.internal.getNumberOfPages();
        const rawTimestamp = new Date().toLocaleString();

        for (let p = 1; p <= totalPages; p++) {
          doc.setPage(p);

          const footerY = 286;
          doc.setDrawColor(...hexToRgb(BRAND.border));
          doc.setLineWidth(0.3);
          doc.line(leftMargin, footerY - 3, pageWidth - rightMargin, footerY - 3);

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(...hexToRgb(BRAND.muted));

          // Simple timestamp display on left
          doc.text(rawTimestamp, leftMargin, footerY + 2);

          // Page Numbering on right
          doc.text(
            `Page ${p} of ${totalPages}`,
            pageWidth - rightMargin,
            footerY + 2,
            { align: "right" }
          );
        }

        const filename = `UniLift_Result_${(sample.name || "student").replace(/\s+/g, "_")}_${(sample.university || "university").replace(/\s+/g, "_")}.pdf`;
        doc.save(filename);
      });
    </script>
  </body>
</html>
