<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Unilift PDF Demo</title>
    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        background: #f7f9fb;
        color: #0f1724;
        padding: 28px;
      }
      .card {
        max-width: 820px;
        margin: 28px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
        padding: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }
      .controls {
        margin-top: 20px;
      }
      button {
        background: linear-gradient(to left, #177de4, #00bfff, #40e0d0);
        border: none;
        color: #fff;
        padding: 12px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(23, 125, 228, 0.16);
      }
      pre {
        background: #f3f7fb;
        padding: 14px;
        border-radius: 8px;
        overflow: auto;
      }
      .muted {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img
          id="logo-img"
          src="images/u-logo.png"
          alt="UniLift logo"
          crossorigin="anonymous"
        />
        <div>
          <div style="font-weight: 700; font-size: 1.05rem">
            UniLift — PDF Demo
          </div>
          <div style="font-size: 0.9rem; color: #475569">
            This demo forces the light-mode brand colors for the PDF.
          </div>
        </div>
      </div>

      <p style="margin-top: 14px">
        Click the button to generate a sample premium PDF for a mocked student
        result. The PDF is created client-side using jsPDF and downloads
        automatically.
      </p>

      <div class="controls">
        <button id="genPdf">Generate Premium PDF</button>
      </div>

      <h4 style="margin-top: 18px">Sample data used</h4>
      <pre id="sampleData"></pre>

      <label
        for="customNote"
        style="display: block; margin-top: 12px; font-weight: 600"
        >Custom sentence (appears above footer)</label
      >
      <textarea
        id="customNote"
        rows="2"
        style="
          width: 100%;
          margin-top: 8px;
          padding: 10px;
          border-radius: 8px;
          border: 1px solid #e6eef6;
        "
      >
This report is for guidance only. Verify program requirements on official university portals.</textarea
      >
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // Light-mode brand colors (force these in PDF regardless of page theme)
      const BRAND = {
        primary: "#177de4",
        accent: "#3cc6d6",
        text: "#0f1724",
        muted: "#6b7280",
        passBg: "#e6fffa",
      };

      const sample = {
        name: "John Doe",
        email: "john.doe@example.com",
        university: "University of Ghana",
        aggregate: 12,
        // weakGrades used to choose targeted tips (length > 2 triggers private-university tip)
        weakGrades: ["Mathematics", "Physics", "Chemistry"],
        courses: [
          { program_name: "BSc Computer Science", cutoff: 12 },
          { program_name: "BSc Economics", cutoff: 10 },
          { program_name: "BSc Information Technology", cutoff: 13 },
          { program_name: "BA Communication Studies", cutoff: 14 },
          { program_name: "BSc Mathematics", cutoff: 11 },
        ],
      };

      document.getElementById("sampleData").innerText = JSON.stringify(
        sample,
        null,
        2,
      );

      async function imageToDataUrl(imgEl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            try {
              resolve(canvas.toDataURL("image/png"));
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
          img.src = imgEl.src;
        });
      }

      document.getElementById("genPdf").addEventListener("click", async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        // Use Helvetica for a clean, lightweight look
        doc.setFont("helvetica", "normal");

        // Header (logo + title)
        doc.setDrawColor(...hexToRgb(BRAND.primary));
        doc.setLineWidth(0.6);
        doc.line(14, 22, 196, 22);

        try {
          const logoEl = document.getElementById("logo-img");
          const logoData = await imageToDataUrl(logoEl);
          doc.addImage(logoData, "PNG", 14, 8, 18, 18);
        } catch (e) {}

        doc.setFontSize(14);
        doc.setTextColor(...hexToRgb(BRAND.primary));
        doc.text("UniLift", 38, 14);

        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("University Match Report", 38, 19);

        // Profile card (two-column)
        let left = 14;
        let y = 34;
        const cardH = 26;
        doc.setFillColor(247, 250, 252);
        doc.roundedRect(left, y, 182, cardH, 4, 4, "F");

        // left column
        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("Student Name", left + 6, y + 7);
        doc.setFontSize(11);
        doc.setTextColor(...hexToRgb(BRAND.text));
        doc.text(sample.name || "—", left + 6, y + 13);

        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("Email Address", left + 6, y + 18);
        doc.setFontSize(10);
        doc.setTextColor(...hexToRgb(BRAND.text));
        doc.text(sample.email || "—", left + 6, y + 24);

        // right column
        const rightColX = left + 92;
        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("Target University", rightColX + 6, y + 7);
        doc.setFontSize(11);
        doc.setTextColor(...hexToRgb(BRAND.text));
        doc.text(sample.university || "—", rightColX + 6, y + 13);

        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        doc.text("Aggregate Score", rightColX + 6, y + 18);
        doc.setFontSize(16);
        doc.setTextColor(...hexToRgb(BRAND.primary));
        doc.text(String(sample.aggregate), rightColX + 50, y + 18);

        // section title
        y += cardH + 8;
        doc.setFontSize(12);
        doc.setTextColor(...hexToRgb(BRAND.text));
        doc.setFont("helvetica", "bold");
        doc.text("Eligible Programs", left, y);
        doc.setFont("helvetica", "normal");
        y += 6;

        // table header
        const tableX = left;
        const tableW = 182;
        const thH = 8;
        doc.setFillColor(...hexToRgb(BRAND.primary));
        doc.setTextColor(255, 255, 255);
        doc.rect(tableX, y, tableW, thH, "F");
        doc.setFontSize(10);
        doc.text("Program Name", tableX + 4, y + 6);
        doc.text("Cutoff Grade", tableX + tableW - 28, y + 6, {
          align: "right",
        });
        doc.setTextColor(...hexToRgb(BRAND.text));
        y += thH + 2;

        // rows and pagination
        const rowH = 8;
        for (let i = 0; i < sample.courses.length; i++) {
          const c = sample.courses[i];
          if (y + rowH > 270) {
            doc.addPage();
            y = 20;
          }

          if (i % 2 === 0) {
            doc.setFillColor(248, 250, 252);
            doc.rect(tableX, y - 2, tableW, rowH, "F");
          }

          doc.setFontSize(10);
          doc.setTextColor(...hexToRgb(BRAND.text));
          doc.text(c.program_name, tableX + 4, y + 4);

          const cutoff = String(
            c.cutoff ?? c.cutoff_criteria?.minimum_aggregate ?? "—",
          );
          doc.setTextColor(...hexToRgb(BRAND.muted));
          doc.text(cutoff, tableX + tableW - 8, y + 4, { align: "right" });
          y += rowH;
        }

        // advice box
        y += 6;
        const tips = selectTips(
          sample,
          {
            elegible: sample.courses.filter(
              (c) => sample.aggregate <= c.cutoff,
            ),
            weakGrades: sample.weakGrades,
          },
          2,
        );
        doc.setFillColor(235, 248, 255);
        doc.roundedRect(left, y - 2, 182, 18 + tips.length * 6, 3, 3, "F");
        doc.setFontSize(10);
        doc.setTextColor(...hexToRgb(BRAND.primary));
        doc.text("Next Steps & Recommendations:", left + 4, y + 6);
        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.text));
        for (let t = 0; t < tips.length; t++) {
          doc.text(`• ${tips[t]}`, left + 8, y + 12 + t * 6);
        }
        y += 18 + tips.length * 6;

        // footer
        const ts = new Date().toLocaleString();
        doc.setFontSize(9);
        doc.setTextColor(...hexToRgb(BRAND.muted));
        if (y + 24 > 287) {
          doc.addPage();
          y = 20;
        }
        doc.setDrawColor(...hexToRgb(BRAND.primary));
        doc.line(14, 285, 196, 285);
        doc.text(`Generated on: ${ts}`, 14, 290);
        doc.text(
          `Website: unilift.app · Email: uniliftapp1@gmail.com · WhatsApp: +233 50 930 4981`,
          105,
          290,
          { align: "right" },
        );

        try {
          const logoEl2 = document.getElementById("logo-img");
          const logoData2 = await imageToDataUrl(logoEl2);
          doc.addImage(logoData2, "PNG", 170, 284, 16, 16);
        } catch (e) {}

        const filename = `UniLift_Result_${(sample.name || "student").replace(/\s+/g, "_")}_${(sample.university || "university").replace(/\s+/g, "_")}.pdf`;
        doc.save(filename);
      });

      // Tip selection logic: prioritized rules then fill from pool (deterministic by name seed)
      function selectTips(
        student,
        { elegible = [], weakGrades = [] } = {},
        N = 2,
      ) {
        const pool = [
          "Small improvements in one subject often beat large drops elsewhere.",
          "Strengthening electives can improve chances for selective programs.",
          "Look for foundation/bridge courses if you’re just under cutoffs.",
          "If you have many options, prioritize by course fit not prestige.",
        ];

        const results = [];

        // 1) Weak-grades rule
        if ((weakGrades || []).length > 2) {
          results.push(
            "Target private universities with flexible entry or bursaries.",
          );
        }

        // 2) No matches
        if ((elegible || []).length === 0) {
          results.push(
            "Look for foundation/bridge courses if you’re just under cutoffs.",
          );
        }

        // 3) Many options
        if ((elegible || []).length >= 8 && results.length < N) {
          results.push(
            "Shortlist 3–5 programs and apply early to improve chances.",
          );
        }

        // 4) Near-cutoff (within 2 points)
        const near = (student.courses || []).some(
          (c) => Math.abs(student.aggregate - c.cutoff) <= 2,
        );
        if (near && results.length < N) {
          results.push(
            "Try mock tests/tutors for subjects closest to the cutoff.",
          );
        }

        // fill remaining from pool deterministically using name seed
        const seed = hashString(student.name || "") || Date.now();
        const rnd = mulberry32(seed);
        // shuffle pool deterministic
        const shuffled = pool.slice().sort(() => rnd() - 0.5);
        for (let i = 0; i < shuffled.length && results.length < N; i++) {
          if (!results.includes(shuffled[i])) results.push(shuffled[i]);
        }

        return results.slice(0, N);
      }

      // small deterministic PRNG helpers
      function hashString(str) {
        if (!str) return 0;
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h;
      }

      function mulberry32(a) {
        return function () {
          var t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // UI gating: hide download button when there are no eligible programs
      (function applyGatingToButton() {
        const btn = document.getElementById("genPdf");
        const elegible = sample.courses.filter(
          (c) => sample.aggregate <= c.cutoff,
        );
        if (!elegible || elegible.length === 0) {
          btn.style.display = "none";
          const note = document.createElement("div");
          note.className = "muted";
          note.style.marginTop = "10px";
          note.innerText = "Download disabled — no eligible programs found.";
          btn.parentNode.appendChild(note);
        }
      })();

      function hexToRgb(hex) {
        const cleaned = hex.replace("#", "");
        const r = parseInt(cleaned.substring(0, 2), 16);
        const g = parseInt(cleaned.substring(2, 4), 16);
        const b = parseInt(cleaned.substring(4, 6), 16);
        return [r, g, b];
      }
    </script>
  </body>
</html>
